<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="BPI Virtual Analyst architecture diagram">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B20710" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f2f2f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f1f1f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0b0b0b"/>
  <rect width="1000" height="640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e5e5e5" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">BPI Virtual Analyst — System Architecture</text>
  <text x="500" y="66" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Four layers from analyst UI to batch observability</text>

  <!-- Layer 1: Analyst interface -->
  <g id="layer1">
    <text x="500" y="105" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 1 — ANALYST INTERFACE</text>
    <rect x="65" y="125" width="205" height="70" rx="8" fill="url(#coral)" stroke="#E50914" stroke-width="1.5"/>
    <text x="167.5" y="158" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Streamlit UI</text>
    <text x="167.5" y="178" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">analyst-facing</text>

    <rect x="295" y="125" width="205" height="70" rx="8" fill="url(#coral)" stroke="#E50914" stroke-width="1.5"/>
    <text x="397.5" y="158" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">CSV / Excel upload</text>
    <text x="397.5" y="178" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">up to 40 MB</text>

    <rect x="525" y="125" width="205" height="70" rx="8" fill="url(#coral)" stroke="#E50914" stroke-width="1.5"/>
    <text x="627.5" y="158" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Workflow picker</text>
    <text x="627.5" y="178" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">prompts + schemas</text>

    <rect x="755" y="125" width="205" height="70" rx="8" fill="url(#coral)" stroke="#E50914" stroke-width="1.5"/>
    <text x="857.5" y="158" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Model picker</text>
    <text x="857.5" y="178" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">30+ options</text>
  </g>

  <!-- Arrows to layer 2 -->
  <line x1="167.5" y1="195" x2="397.5" y2="255" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="397.5" y1="195" x2="397.5" y2="255" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="627.5" y1="195" x2="627.5" y2="255" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="857.5" y1="195" x2="857.5" y2="255" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Layer 2: API + PII -->
  <g id="layer2">
    <text x="500" y="245" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 2 — API &amp; PRIVACY</text>
    <rect x="145" y="265" width="350" height="70" rx="8" fill="url(#gray)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="320" y="298" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Flask API · auth · job submission</text>
    <text x="320" y="318" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">JWT · token-lifetime check · rate-limit</text>

    <rect x="525" y="265" width="350" height="70" rx="8" fill="url(#gray)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="700" y="298" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Presidio PII scrubber</text>
    <text x="700" y="318" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">entity-targeted · 30% faster</text>
  </g>

  <!-- Arrows to layer 3 -->
  <line x1="320" y1="335" x2="320" y2="405" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="700" y1="335" x2="700" y2="405" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Layer 3: Workers, Redis, Router, DB -->
  <g id="layer3">
    <text x="500" y="395" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 3 — EXECUTION</text>
    <rect x="65" y="415" width="205" height="70" rx="8" fill="url(#dark)" stroke="#E50914" stroke-width="1.5"/>
    <text x="167.5" y="448" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Celery worker pool</text>
    <text x="167.5" y="468" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">chunked · streaming · retry</text>

    <rect x="295" y="415" width="205" height="70" rx="8" fill="url(#dark)" stroke="#E50914" stroke-width="1.5"/>
    <text x="397.5" y="448" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Redis · job state</text>
    <text x="397.5" y="468" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">progress · partial results</text>

    <rect x="525" y="415" width="205" height="70" rx="8" fill="url(#dark)" stroke="#E50914" stroke-width="1.5"/>
    <text x="627.5" y="448" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Model router</text>
    <text x="627.5" y="468" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">OpenAI · Claude · Gemini · Bedrock</text>

    <rect x="755" y="415" width="205" height="70" rx="8" fill="url(#dark)" stroke="#E50914" stroke-width="1.5"/>
    <text x="857.5" y="448" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">SQLAlchemy</text>
    <text x="857.5" y="468" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">audit log · runs · prompts</text>
  </g>

  <!-- Arrows to layer 4 -->
  <line x1="167.5" y1="485" x2="282" y2="545" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="397.5" y1="485" x2="500" y2="545" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="627.5" y1="485" x2="718" y2="545" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>
  <line x1="857.5" y1="485" x2="857.5" y2="545" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Layer 4: Batch + observability -->
  <g id="layer4">
    <text x="500" y="535" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 4 — BATCH &amp; OBSERVABILITY</text>
    <rect x="195" y="555" width="225" height="60" rx="8" fill="url(#gray)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="307.5" y="582" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Airflow nightly</text>
    <text x="307.5" y="600" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">backfills · refresh</text>

    <rect x="430" y="555" width="225" height="60" rx="8" fill="url(#gray)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="542.5" y="582" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Hive / Trino</text>
    <text x="542.5" y="600" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">historical analyses</text>

    <rect x="665" y="555" width="225" height="60" rx="8" fill="url(#gray)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="777.5" y="582" text-anchor="middle" fill="#fff" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">OTel + Datadog</text>
    <text x="777.5" y="600" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11">latency · cost · errors</text>
  </g>
</svg>