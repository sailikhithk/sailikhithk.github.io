<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Oracle Cloud ERP Analytics & Fraud Detection Architecture">
  <defs>
    <pattern id="grid-or" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-or" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
    <linearGradient id="coral-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B20710" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gray-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f2f2f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f1f1f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dark-or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0b0b0b"/>
  <rect width="1000" height="640" fill="url(#grid-or)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e5e5e5" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">ERP Analytics &amp; Fraud Detection — Architecture</text>
  <text x="500" y="64" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Oracle Cloud ERP events, Spark streaming aggregations, and ELK audit intelligence</text>

  <!-- Layer 1: ERP Application Events -->
  <g id="layer1-or">
    <text x="500" y="100" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 1 — ORACLE CLOUD HCM / ERP APPLICATION SOURCES</text>
    
    <rect x="65" y="118" width="265" height="68" rx="8" fill="url(#coral-or)" stroke="#E50914" stroke-width="1.5"/>
    <text x="197.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Oracle Cloud HCM / Financials</text>
    <text x="197.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">13 global business unit ledgers</text>

    <rect x="365" y="118" width="270" height="68" rx="8" fill="url(#coral-or)" stroke="#E50914" stroke-width="1.5"/>
    <text x="500" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Transactional CDC Feeds</text>
    <text x="500" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Journal entries, payroll &amp; invoice events</text>

    <rect x="670" y="118" width="265" height="68" rx="8" fill="url(#coral-or)" stroke="#E50914" stroke-width="1.5"/>
    <text x="802.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Access Control Logs</text>
    <text x="802.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Privilege escalation &amp; role audits</text>
  </g>

  <!-- Arrows to layer 2 -->
  <line x1="197.5" y1="186" x2="330" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>
  <line x1="500" y1="186" x2="500" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>
  <line x1="802.5" y1="186" x2="670" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>

  <!-- Layer 2: Ingestion & Buffer -->
  <g id="layer2-or">
    <text x="500" y="235" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 2 — STREAM INGESTION &amp; LOG AGGREGATION BUFFER</text>
    
    <rect x="120" y="255" width="360" height="72" rx="8" fill="url(#gray-or)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="300" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Distributed Message Bus (Kafka)</text>
    <text x="300" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Partitioned by org unit &amp; transaction hash</text>

    <rect x="520" y="255" width="360" height="72" rx="8" fill="url(#gray-or)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="700" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Logstash Pipeline Shipper</text>
    <text x="700" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Log normalization, filtering &amp; geo-enrichment</text>
  </g>

  <!-- Arrows to layer 3 -->
  <line x1="300" y1="327" x2="300" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>
  <line x1="700" y1="327" x2="700" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>

  <!-- Layer 3: Stream Processing & Anomaly Scoring -->
  <g id="layer3-or">
    <text x="500" y="375" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 3 — REAL-TIME SPARK ENGINE &amp; FRAUD SCORING</text>
    
    <rect x="65" y="395" width="265" height="70" rx="8" fill="url(#dark-or)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="197.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Spark Streaming Aggregations</text>
    <text x="197.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sliding-window expense velocity checks</text>

    <rect x="365" y="395" width="270" height="70" rx="8" fill="url(#dark-or)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="500" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Fraud Rule Classifier</text>
    <text x="500" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Duplicate claims &amp; off-cycle payment rules</text>

    <rect x="670" y="395" width="265" height="70" rx="8" fill="url(#dark-or)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="802.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Quarterly Forecast Model</text>
    <text x="802.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated headcount &amp; burn projections</text>
  </g>

  <!-- Arrows to layer 4 -->
  <line x1="500" y1="465" x2="500" y2="520" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-or)" opacity="0.6"/>

  <!-- Layer 4: Kibana Dashboards & Compliance -->
  <g id="layer4-or">
    <text x="500" y="510" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 4 — ELASTICSEARCH / KIBANA ANALYTICS &amp; SOX COMPLIANCE</text>
    
    <rect x="65" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="270" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Elasticsearch 7.x Cluster</text>
    <text x="270" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Fast sub-second search across hundreds of millions of audit entries</text>

    <rect x="525" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="730" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Kibana Real-Time Dashboards &amp; SOX Reports</text>
    <text x="730" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">C-suite visibility into anomalous spending &amp; automated audit readiness</text>
  </g>
</svg>
