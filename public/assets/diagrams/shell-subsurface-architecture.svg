<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Shell Subsurface ML and Drilling-Loss Prediction Architecture">
  <defs>
    <pattern id="grid-sh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-sh" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
    <linearGradient id="coral-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B20710" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gray-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f2f2f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f1f1f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dark-sh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0b0b0b"/>
  <rect width="1000" height="640" fill="url(#grid-sh)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e5e5e5" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Subsurface ML &amp; Drilling Inversion — Architecture</text>
  <text x="500" y="64" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">NLP log parsing, 1D CNN acoustic impedance inversion, and SHAP explainability</text>

  <!-- Layer 1: Rig Data & Sensor Ingestion -->
  <g id="layer1-sh">
    <text x="500" y="100" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 1 — RIG TELEMETRY &amp; DRILLING LOG INGESTION</text>
    
    <rect x="65" y="118" width="265" height="68" rx="8" fill="url(#coral-sh)" stroke="#E50914" stroke-width="1.5"/>
    <text x="197.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Daily Drilling Reports (DDRs)</text>
    <text x="197.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Unstructured engineer operational logs</text>

    <rect x="365" y="118" width="270" height="68" rx="8" fill="url(#coral-sh)" stroke="#E50914" stroke-width="1.5"/>
    <text x="500" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Petrophysical Well Logs</text>
    <text x="500" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gamma ray, sonic velocity, resistivity</text>

    <rect x="670" y="118" width="265" height="68" rx="8" fill="url(#coral-sh)" stroke="#E50914" stroke-width="1.5"/>
    <text x="802.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Seismic Trace Feeds</text>
    <text x="802.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pre-stack acoustic amplitudes</text>
  </g>

  <!-- Arrows to layer 2 -->
  <line x1="197.5" y1="186" x2="330" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>
  <line x1="500" y1="186" x2="500" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>
  <line x1="802.5" y1="186" x2="670" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>

  <!-- Layer 2: NLP Pipeline & Feature Fusion -->
  <g id="layer2-sh">
    <text x="500" y="235" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 2 — DOMAIN NLP &amp; MULTIMODAL FEATURE FUSION</text>
    
    <rect x="120" y="255" width="360" height="72" rx="8" fill="url(#gray-sh)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="300" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Domain-Tuned NLP NER Pipeline</text>
    <text x="300" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Loss severity parsing · Lithology keyword vectorizer</text>

    <rect x="520" y="255" width="360" height="72" rx="8" fill="url(#gray-sh)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="700" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Depth-Aligned Feature Normalizer</text>
    <text x="700" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Time-to-depth conversion &amp; missing curve imputation</text>
  </g>

  <!-- Arrows to layer 3 -->
  <line x1="300" y1="327" x2="300" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>
  <line x1="700" y1="327" x2="700" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>

  <!-- Layer 3: Deep Learning & Inversion Models -->
  <g id="layer3-sh">
    <text x="500" y="375" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 3 — DEEP LEARNING INVERSION &amp; LOSS CLASSIFIER</text>
    
    <rect x="65" y="395" width="265" height="70" rx="8" fill="url(#dark-sh)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="197.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">1D Dilated CNN Inversion</text>
    <text x="197.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Non-linear acoustic impedance mapping</text>

    <rect x="365" y="395" width="270" height="70" rx="8" fill="url(#dark-sh)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="500" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Loss Predictor (F1: 0.84)</text>
    <text x="500" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gradient boosted tree + Bi-LSTM ensemble</text>

    <rect x="670" y="395" width="265" height="70" rx="8" fill="url(#dark-sh)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="802.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pore Pressure Boundary</text>
    <text x="802.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Fracture gradient envelope checks</text>
  </g>

  <!-- Arrows to layer 4 -->
  <line x1="500" y1="465" x2="500" y2="520" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-sh)" opacity="0.6"/>

  <!-- Layer 4: Responsible AI & Rig Operations -->
  <g id="layer4-sh">
    <text x="500" y="510" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 4 — RESPONSIBLE AI INTERPRETABILITY &amp; RIG-SIDE ALERTING</text>
    
    <rect x="65" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="270" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SHAP &amp; LIME Feature Attribution</text>
    <text x="270" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Geologist trust · Transparent factor importance per foot drilled</text>

    <rect x="525" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="730" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Real-Time Wellbore Hazard Dashboard</text>
    <text x="730" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gulf of Mexico drilling advisory · Proactive mud weight adjustments</text>
  </g>
</svg>
