<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="FacadeDriver multi-model LLM orchestration architecture">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#18BC9C"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#48BB78"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F56565"/>
    </marker>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1526" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1526" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18BC9C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D1526" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0a0a0a"/>
  <rect width="1000" height="640" fill="url(#grid)"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#e5e5e5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">FacadeDriver - Multi-Model LLM Orchestration</text>
  <text x="500" y="66" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">30+ foundation models with routing, retry, fallback, and graceful degradation</text>

  <!-- Layer 1: User Request -->
  <rect x="350" y="90" width="300" height="50" rx="6" fill="url(#navy)" stroke="#18BC9C" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="14" font-weight="600">User Request (CSV / API / Chat)</text>
  <text x="500" y="132" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">10K rows/run | 40MB uploads | PII-safe via Presidio</text>

  <!-- Arrow down -->
  <line x1="500" y1="140" x2="500" y2="170" stroke="#18BC9C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: FacadeDriver Core -->
  <rect x="200" y="170" width="600" height="80" rx="8" fill="url(#blue)" stroke="#18BC9C" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="16" font-weight="700">FacadeDriver - Model-Agnostic Abstraction Layer</text>
  <text x="500" y="215" text-anchor="middle" fill="#e5e5e5" font-family="Helvetica Neue, Arial" font-size="11">Routing | Retry | Fallback | Graceful Degradation</text>
  <text x="500" y="232" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Per-model token policies | Model tiering for cost | Batch inference (50% savings)</text>

  <!-- Arrows fanning out to models -->
  <line x1="300" y1="250" x2="150" y2="290" stroke="#18BC9C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="250" x2="320" y2="290" stroke="#18BC9C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="500" y2="290" stroke="#18BC9C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="680" y2="290" stroke="#18BC9C" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="250" x2="850" y2="290" stroke="#18BC9C" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Model Pool (30+) -->
  <rect x="60" y="290" width="160" height="60" rx="6" fill="url(#slate)" stroke="#18BC9C" stroke-width="1"/>
  <text x="140" y="315" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">AWS Bedrock</text>
  <text x="140" y="332" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Claude, Titan, Llama</text>

  <rect x="240" y="290" width="160" height="60" rx="6" fill="url(#slate)" stroke="#18BC9C" stroke-width="1"/>
  <text x="320" y="315" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">OpenAI</text>
  <text x="320" y="332" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">GPT-4o, o1, o3</text>

  <rect x="420" y="290" width="160" height="60" rx="6" fill="url(#slate)" stroke="#18BC9C" stroke-width="1"/>
  <text x="500" y="315" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">Anthropic</text>
  <text x="500" y="332" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Opus, Sonnet, Haiku</text>

  <rect x="600" y="290" width="160" height="60" rx="6" fill="url(#slate)" stroke="#18BC9C" stroke-width="1"/>
  <text x="680" y="315" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">Vertex Gemini</text>
  <text x="680" y="332" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">1.5 Pro, Flash</text>

  <rect x="780" y="290" width="160" height="60" rx="6" fill="url(#slate)" stroke="#18BC9C" stroke-width="1"/>
  <text x="860" y="315" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">vLLM / Open</text>
  <text x="860" y="332" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Llama, Mistral, self-hosted</text>

  <!-- Arrows converging back -->
  <line x1="140" y1="350" x2="280" y2="390" stroke="#48BB78" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="320" y1="350" x2="360" y2="390" stroke="#48BB78" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="350" x2="500" y2="390" stroke="#48BB78" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="680" y1="350" x2="640" y2="390" stroke="#48BB78" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="860" y1="350" x2="720" y2="390" stroke="#48BB78" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Layer 4: Eval Gate -->
  <rect x="200" y="390" width="600" height="70" rx="8" fill="url(#navy)" stroke="#48BB78" stroke-width="2"/>
  <text x="500" y="415" text-anchor="middle" fill="#48BB78" font-family="Helvetica Neue, Arial" font-size="15" font-weight="700">LLM-as-Judge Eval Gate</text>
  <text x="500" y="435" text-anchor="middle" fill="#e5e5e5" font-family="Helvetica Neue, Arial" font-size="11">Precision >= 0.85 | Recall >= 0.80 | 1,690 ground-truth samples</text>
  <text x="500" y="450" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Flip-analysis | Dual-model A/B | Drift detection | Failure-mode partitioning</text>

  <!-- Decision: Pass/Fail -->
  <line x1="350" y1="460" x2="250" y2="500" stroke="#48BB78" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="650" y1="460" x2="750" y2="500" stroke="#F56565" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Pass -->
  <rect x="120" y="500" width="260" height="55" rx="6" fill="url(#slate)" stroke="#48BB78" stroke-width="1.5"/>
  <text x="250" y="525" text-anchor="middle" fill="#48BB78" font-family="Helvetica Neue, Arial" font-size="13" font-weight="600">PASS - Ship to Production</text>
  <text x="250" y="542" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">F1 = 0.654 (project-best) | 128+ users served</text>

  <!-- Fail -->
  <rect x="620" y="500" width="260" height="55" rx="6" fill="url(#slate)" stroke="#F56565" stroke-width="1.5"/>
  <text x="750" y="525" text-anchor="middle" fill="#F56565" font-family="Helvetica Neue, Arial" font-size="13" font-weight="600">FAIL - Block Production</text>
  <text x="750" y="542" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">Human review via Labelbox | Iterate on prompt/model</text>

  <!-- Bottom: Airbnb mapping -->
  <rect x="60" y="580" width="880" height="45" rx="6" fill="url(#navy)" stroke="#18BC9C" stroke-width="1"/>
  <text x="500" y="600" text-anchor="middle" fill="#18BC9C" font-family="Helvetica Neue, Arial" font-size="12" font-weight="600">Airbnb Production Eval Gate: Same pattern, 5 models tuned per task, verbatim citations on every output</text>
  <text x="500" y="615" text-anchor="middle" fill="#888888" font-family="Helvetica Neue, Arial" font-size="10">My FacadeDriver runs 30+ models with the same eval-gated accuracy guarantee</text>
</svg>