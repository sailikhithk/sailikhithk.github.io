<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Eli Lilly Dose Management System Architecture">
  <defs>
    <pattern id="grid-lilly" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-lilly" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3b3b3"/>
    </marker>
    <linearGradient id="coral-lilly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B20710" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="gray-lilly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f2f2f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1f1f1f" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="dark-lilly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0b0b0b"/>
  <rect width="1000" height="640" fill="url(#grid-lilly)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#e5e5e5" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Dose Management System — Radiopharmaceutical Architecture</text>
  <text x="500" y="64" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Decay-adjusted scheduling, temporal orchestration, and compliance auditing</text>

  <!-- Layer 1: Hospital & Clinic Portals -->
  <g id="layer1-lilly">
    <text x="500" y="100" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 1 — CLINICAL INTEGRATION &amp; ORDER INGESTION</text>
    
    <rect x="65" y="118" width="265" height="68" rx="8" fill="url(#coral-lilly)" stroke="#E50914" stroke-width="1.5"/>
    <text x="197.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Hospital Portal &amp; EMR</text>
    <text x="197.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Patient prescription &amp; scan times</text>

    <rect x="365" y="118" width="270" height="68" rx="8" fill="url(#coral-lilly)" stroke="#E50914" stroke-width="1.5"/>
    <text x="500" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Dose Prescription Engine</text>
    <text x="500" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Isotope half-life calibration (Lu-177, Ac-225)</text>

    <rect x="670" y="118" width="265" height="68" rx="8" fill="url(#coral-lilly)" stroke="#E50914" stroke-width="1.5"/>
    <text x="802.5" y="148" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Radio-Safety Gate</text>
    <text x="802.5" y="168" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">RAM license &amp; geographic boundary validation</text>
  </g>

  <!-- Arrows to layer 2 -->
  <line x1="197.5" y1="186" x2="330" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>
  <line x1="500" y1="186" x2="500" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>
  <line x1="802.5" y1="186" x2="670" y2="245" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>

  <!-- Layer 2: Core Platform & Orchestration -->
  <g id="layer2-lilly">
    <text x="500" y="235" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 2 — MICROSERVICES &amp; TEMPORAL WORKFLOWS</text>
    
    <rect x="120" y="255" width="360" height="72" rx="8" fill="url(#gray-lilly)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="300" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Spring Boot 3.2 Core API</text>
    <text x="300" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Dose calculation · Batch scheduling · Multi-tenant security</text>

    <rect x="520" y="255" width="360" height="72" rx="8" fill="url(#gray-lilly)" stroke="#5a5a5a" stroke-width="1.5"/>
    <text x="700" y="286" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Temporal Workflow Cluster</text>
    <text x="700" y="306" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Decay-adjusted long-running workflows · Automated retries</text>
  </g>

  <!-- Arrows to layer 3 -->
  <line x1="300" y1="327" x2="300" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>
  <line x1="700" y1="327" x2="700" y2="385" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>

  <!-- Layer 3: Radiopharmacy & Logistics -->
  <g id="layer3-lilly">
    <text x="500" y="375" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 3 — RADIOPHARMACY EXECUTION &amp; COLD-CHAIN LOGISTICS</text>
    
    <rect x="65" y="395" width="265" height="70" rx="8" fill="url(#dark-lilly)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="197.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Cyclotron / Reactor Sync</text>
    <text x="197.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Isotope synthesis tracking</text>

    <rect x="365" y="395" width="270" height="70" rx="8" fill="url(#dark-lilly)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="500" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dispensing &amp; Hot-Cell Robot</text>
    <text x="500" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Exact radioactivity vialing</text>

    <rect x="670" y="395" width="265" height="70" rx="8" fill="url(#dark-lilly)" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="802.5" y="426" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">GPS &amp; Radiation Telemetry</text>
    <text x="802.5" y="446" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Couriers with live decay telemetry</text>
  </g>

  <!-- Arrows to layer 4 -->
  <line x1="500" y1="465" x2="500" y2="520" stroke="#b3b3b3" stroke-width="1.5" marker-end="url(#arrow-lilly)" opacity="0.6"/>

  <!-- Layer 4: Persistence & Compliance -->
  <g id="layer4-lilly">
    <text x="500" y="510" text-anchor="middle" fill="#E50914" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">LAYER 4 — DATA STORAGE, COMPLIANCE &amp; 21 CFR PART 11 AUDIT LOGS</text>
    
    <rect x="65" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="270" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PostgreSQL 16 Multi-Cluster + Flyway</text>
    <text x="270" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Idempotent migrations · Partitioned historical master data</text>

    <rect x="525" y="530" width="410" height="72" rx="8" fill="#141414" stroke="#E50914" stroke-width="1.5"/>
    <text x="730" y="560" text-anchor="middle" fill="#fff" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dual-Layer Auditing &amp; Telemetry</text>
    <text x="730" y="580" text-anchor="middle" fill="#b3b3b3" font-family="Netflix Sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">DB-level trigger logs (audit_logs) + Loki/Grafana business events</text>
  </g>
</svg>
