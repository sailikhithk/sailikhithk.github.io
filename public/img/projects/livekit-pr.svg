<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLiveKit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgLiveKit)" stroke="#30363d" stroke-width="2"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="600" height="64" rx="16" fill="#161b22"/>
  <rect x="0" y="48" width="600" height="16" fill="#161b22"/>
  <line x1="0" y1="64" x2="600" y2="64" stroke="#30363d" stroke-width="1.5"/>

  <!-- Repo Icon & Name -->
  <circle cx="36" cy="32" r="16" fill="#1f1f38" stroke="#3d3d75" stroke-width="1.5"/>
  <text x="36" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#00d2ff" text-anchor="middle">🎙️</text>
  <text x="64" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#58a6ff">livekit / agents</text>

  <!-- PR Status Badge -->
  <g transform="translate(475, 18)">
    <rect width="105" height="28" rx="14" fill="#238636"/>
    <circle cx="16" cy="14" r="4" fill="#fff"/>
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#fff">PR #6754</text>
  </g>

  <!-- PR Title -->
  <text x="24" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Add ReliabilityObserver &amp; Auto-Recovery</text>
  <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e">by <tspan fill="#f0f6fc" font-weight="600">sailikhithk</tspan> • into <tspan fill="#8b949e">main</tspan> • 6 files changed • 23 unit tests</text>

  <!-- Code Block Preview -->
  <rect x="24" y="145" width="552" height="175" rx="8" fill="#090d13" stroke="#30363d" stroke-width="1"/>
  
  <!-- Code Lines -->
  <text x="40" y="175" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787">+ class ReliabilityObserver(AgentObserver):</text>
  <text x="40" y="198" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787">+     async def on_transport_degraded(self, event: ConnectionEvent):</text>
  <text x="40" y="221" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787">+         logger.warning(f"Voice pipeline latency spiked: {event.rtt_ms}ms")</text>
  <text x="40" y="244" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787">+         await self.trigger_reconnect_strategy(backoff_ms=50)</text>
  <text x="40" y="267" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#7ee787">+         self.metrics.increment("voice_agent.auto_healed_sessions")</text>
  <text x="40" y="295" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">      # 23 Test Cases verifying jitter &amp; failover</text>

  <!-- Footer Tags -->
  <g transform="translate(24, 338)">
    <rect width="100" height="24" rx="6" fill="#1f242c" stroke="#30363d"/>
    <text x="50" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">★ 10k+ Stars</text>
  </g>
  <g transform="translate(132, 338)">
    <rect width="125" height="24" rx="6" fill="#1f242c" stroke="#30363d"/>
    <text x="62" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#7ee787" text-anchor="middle">✓ 23 Tests Passed</text>
  </g>
  <g transform="translate(266, 338)">
    <rect width="125" height="24" rx="6" fill="#1f242c" stroke="#30363d"/>
    <text x="62" y="16" font-family="-apple-system, sans-serif" font-size="11" fill="#d2a8ff" text-anchor="middle">Voice AI Reliability</text>
  </g>
